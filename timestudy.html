<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TimeStudy Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="no-nav">

    <main>
        <section class="timer-card multi-timers">
            <h1 class="timer-title">TimeStudy-inator</h1>
        <div style="text-align:center; margin-bottom:12px;">
            <input id="csv-title" type="text" placeholder="CSV file name (optional)" style="font-size:1.1rem; padding:6px 10px; border-radius:6px; border:1px solid #ccc; max-width:320px; width:90%;">
        </div>

                        <!-- Sheet tabs and top sheet showing current times for timers 1,2,3 -->
                        <div class="sheet-window">
                                <div class="sheet-tabs" id="sheet-tabs">
                                    <button class="sheet-tab" data-sheet="0" aria-selected="true">Trial 1</button>
                                    <button class="sheet-tab" data-sheet="1">Trial 2</button>
                                    <button class="sheet-tab" data-sheet="2">Trial 3</button>
                                    <button class="sheet-tab" data-sheet="3">Trial 4</button>
                                    <button class="sheet-tab" data-sheet="4">Trial 5</button>
                                </div>
                                <div class="sheet-header">
                                        <table class="sheet-table" aria-label="Current timer times">
                                            <thead>
                                                <tr>
                                                    <th class="row-label">Step</th>
                                                    <th class="header-label">VA</th>
                                                    <th class="header-label">NVA</th>
                                                    <th class="header-label">Walk</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                    <tr id="sheet-row-0"><td class="row-label">1</td><td id="sheet-r0-c0">00:00.00</td><td id="sheet-r0-c1">00:00.00</td><td id="sheet-r0-c2">00:00.00</td></tr>
                                                    <tr id="sheet-row-1"><td class="row-label">2</td><td id="sheet-r1-c0">00:00.00</td><td id="sheet-r1-c1">00:00.00</td><td id="sheet-r1-c2">00:00.00</td></tr>
                                                    <tr id="sheet-row-2"><td class="row-label">3</td><td id="sheet-r2-c0">00:00.00</td><td id="sheet-r2-c1">00:00.00</td><td id="sheet-r2-c2">00:00.00</td></tr>
                                                    <tr id="sheet-row-3"><td class="row-label">4</td><td id="sheet-r3-c0">00:00.00</td><td id="sheet-r3-c1">00:00.00</td><td id="sheet-r3-c2">00:00.00</td></tr>
                                                    <tr id="sheet-row-4"><td class="row-label">5</td><td id="sheet-r4-c0">00:00.00</td><td id="sheet-r4-c1">00:00.00</td><td id="sheet-r4-c2">00:00.00</td></tr>
                                            </tbody>
                                        </table>
                                </div>
                                <!-- Footer below the table: Reset All and Save to csv -->
                <div class="sheet-footer">
                    <button id="reset-this-trial" class="reset-all-btn">Reset This Trial</button>
                    <button id="reset-all-trials" class="reset-all-btn">Reset All Trials</button>
                    <button id="export-state" class="reset-all-btn">Export CSV</button>
                    <span id="save-status" aria-live="polite" style="margin-left:12px;font-size:0.9rem;color:#555"></span>
                </div>
                        </div>

            <div class="timers-grid">
                <!-- Timer 1 -->
                <div class="single-timer" data-index="0">
                    <div class="laps">
                        <div class="laps-table-wrap">
                            <table id="laps-table-0" class="laps-table" aria-label="Lap times timer 1">
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="controls-row">
                        <button class="hold-btn" id="hold-0" aria-label="Timer 1"></button>
                    </div>
                </div>

                <!-- Timer 2 -->
                <div class="single-timer" data-index="1">
                    <div class="laps">
                        <div class="laps-table-wrap">
                            <table id="laps-table-1" class="laps-table" aria-label="Lap times timer 2">
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="controls-row">
                        <button class="hold-btn" id="hold-1" aria-label="Timer 2"></button>
                    </div>
                </div>

                <!-- Timer 3 -->
                <div class="single-timer" data-index="2">
                    <div class="laps">
                        <div class="laps-table-wrap">
                            <table id="laps-table-2" class="laps-table" aria-label="Lap times timer 3">
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="controls-row">
                        <button class="hold-btn" id="hold-2" aria-label="Timer 3"></button>
                    </div>
                </div>

            </div>

        </section>
    </main>

    <script src="timestudy.js"></script>
</body>
</html>
